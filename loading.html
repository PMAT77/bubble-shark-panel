<style>
  .loading-container,
  .loading-container * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .loading-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    user-select: none;
  }

  .loading-container .canvas-wrapper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .loading-container canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .loading-container .loading-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    margin: 0;
    color: #fff;
    font-size: clamp(1.25rem, 4vw, 2rem);
    font-weight: 200;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    text-transform: uppercase;
    font-family: system-ui, -apple-system, sans-serif;
    pointer-events: none;
    animation: spiral-loading-pulse 2s ease-in-out infinite;
  }

  @keyframes spiral-loading-pulse {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.45;
    }
  }

  .loading-container[data-state="failed"] .loading-label {
    animation: none;
    letter-spacing: 0.05em;
    text-indent: 0;
  }

  .loading-container .loading-feedback {
    position: absolute;
    top: calc(50% + 3rem);
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 32rem);
    z-index: 10;
    color: #ddd;
    text-align: center;
    font: 1rem/1.6 system-ui, sans-serif;
  }

  .loading-container .loading-retry {
    margin-top: 1.25rem;
    padding: 0.5rem 1.25rem;
    border: 1px solid #999;
    border-radius: 0.375rem;
    background: #171717;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  .loading-container .loading-retry:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-container .loading-label { animation: none; }
  }
</style>

<div class="loading-container">
  <div class="canvas-wrapper">
    <canvas id="spiralCanvas"></canvas>
  </div>
  <p class="loading-label" aria-live="polite" aria-busy="true">LOADING</p>
  <div class="loading-feedback" hidden>
    <p class="loading-message" role="alert"></p>
    <button type="button" class="loading-retry">重新加载</button>
  </div>
</div>

<script>
  (function () {
    class Vector2D {
      constructor(x, y) {
        this.x = x
        this.y = y
      }

    }

    class Vector3D {
      constructor(x, y, z) {
        this.x = x
        this.y = y
        this.z = z
      }

    }

    class Star {
      constructor(cameraZ, cameraTravelDistance, random) {
        this.angle = random() * Math.PI * 2
        this.distance = 30 * random() + 15
        this.rotationDirection = random() > 0.5 ? 1 : -1
        this.expansionRate = 1.2 + random() * 0.8
        this.finalScale = 0.7 + random() * 0.6

        this.dx = this.distance * Math.cos(this.angle)
        this.dy = this.distance * Math.sin(this.angle)

        this.spiralLocation = (1 - (1 - random()) ** 3.0) / 1.3
        this.z = 0.5 * cameraZ + random() * (cameraTravelDistance + 0.5 * cameraZ)

        const lerp = (start, end, t) => start * (1 - t) + end * t
        this.z = lerp(this.z, cameraTravelDistance / 2, 0.3 * this.spiralLocation)
        this.strokeWeightFactor = random() ** 2.0
      }

      render(p, controller) {
        const spiralPos = controller.spiralPath(this.spiralLocation)
        const q = p - this.spiralLocation

        if (q > 0) {
          const displacementProgress = controller.constrain(4 * q, 0, 1)

          const linearEasing = displacementProgress
          const elasticEasing = controller.easeOutElastic(displacementProgress)
          const powerEasing = displacementProgress ** 2

          let easing
          if (displacementProgress < 0.3) {
            easing = controller.lerp(linearEasing, powerEasing, displacementProgress / 0.3)
          }
          else if (displacementProgress < 0.7) {
            const t = (displacementProgress - 0.3) / 0.4
            easing = controller.lerp(powerEasing, elasticEasing, t)
          }
          else {
            easing = elasticEasing
          }

          let screenX
          let screenY

          if (displacementProgress < 0.3) {
            screenX = controller.lerp(spiralPos.x, spiralPos.x + this.dx * 0.3, easing / 0.3)
            screenY = controller.lerp(spiralPos.y, spiralPos.y + this.dy * 0.3, easing / 0.3)
          }
          else if (displacementProgress < 0.7) {
            const midProgress = (displacementProgress - 0.3) / 0.4
            const curveStrength = Math.sin(midProgress * Math.PI) * this.rotationDirection * 1.5

            const baseX = spiralPos.x + this.dx * 0.3
            const baseY = spiralPos.y + this.dy * 0.3

            const targetX = spiralPos.x + this.dx * 0.7
            const targetY = spiralPos.y + this.dy * 0.7

            const perpX = -this.dy * 0.4 * curveStrength
            const perpY = this.dx * 0.4 * curveStrength

            screenX = controller.lerp(baseX, targetX, midProgress) + perpX * midProgress
            screenY = controller.lerp(baseY, targetY, midProgress) + perpY * midProgress
          }
          else {
            const finalProgress = (displacementProgress - 0.7) / 0.3

            const baseX = spiralPos.x + this.dx * 0.7
            const baseY = spiralPos.y + this.dy * 0.7

            const targetDistance = this.distance * this.expansionRate * 1.5
            const spiralTurns = 1.2 * this.rotationDirection
            const spiralAngle = this.angle + spiralTurns * finalProgress * Math.PI

            const targetX = spiralPos.x + targetDistance * Math.cos(spiralAngle)
            const targetY = spiralPos.y + targetDistance * Math.sin(spiralAngle)

            screenX = controller.lerp(baseX, targetX, finalProgress)
            screenY = controller.lerp(baseY, targetY, finalProgress)
          }

          const vx = (this.z - controller.cameraZ) * screenX / controller.viewZoom
          const vy = (this.z - controller.cameraZ) * screenY / controller.viewZoom

          const position = new Vector3D(vx, vy, this.z)

          let sizeMultiplier = 1.0
          if (displacementProgress < 0.6) {
            sizeMultiplier = 1.0 + displacementProgress * 0.2
          }
          else {
            const t = (displacementProgress - 0.6) / 0.4
            sizeMultiplier = 1.2 * (1.0 - t) + this.finalScale * t
          }

          const dotSize = 8.5 * this.strokeWeightFactor * sizeMultiplier

          controller.showProjectedDot(position, dotSize)
        }
      }
    }

    class AnimationController {
      constructor(canvas, ctx, dpr, size) {
        this.canvas = canvas
        this.ctx = ctx
        this.dpr = dpr
        this.size = size
        this.time = 0
        this.stars = []

        this.changeEventTime = 0.32
        this.cameraZ = -400
        this.cameraTravelDistance = 3400
        this.startDotYOffset = 28
        this.viewZoom = 100
        this.numberOfStars = 5000
        this.trailLength = 80

        this._starBatchCancelled = false
        this.setupRandomGenerator()
        this.setupTimeline()
      }

      setupRandomGenerator() {
        this._seededRandomState = { seed: 1234 }
        this._random = () => this._seededRandom()
        this.startBatchStarCreation()
      }

      _seededRandom() {
        const state = this._seededRandomState
        state.seed = (state.seed * 9301 + 49297) % 233280
        return state.seed / 233280
      }

      startBatchStarCreation() {
        const FIRST_BATCH = 200
        const BATCH_SIZE = 500
        while (this.stars.length < FIRST_BATCH && this.stars.length < this.numberOfStars) {
          this.stars.push(new Star(this.cameraZ, this.cameraTravelDistance, this._random))
        }
        const addBatch = () => {
          if (this._starBatchCancelled || !this.canvas.isConnected) {
            return
          }
          const target = Math.min(this.stars.length + BATCH_SIZE, this.numberOfStars)
          while (this.stars.length < target) {
            this.stars.push(new Star(this.cameraZ, this.cameraTravelDistance, this._random))
          }
          if (this.stars.length < this.numberOfStars) {
            this._batchRafId = requestAnimationFrame(addBatch)
          }
        }
        if (this.stars.length < this.numberOfStars) {
          this._batchRafId = requestAnimationFrame(addBatch)
        }
      }

      setupTimeline() {
        this.cycleDuration = 15000
        this._animStart = performance.now()
        this._rafId = null
        this._lastFrame = -Infinity

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          this.time = 0.15
          this.render()
          this.destroy()
          return
        }

        const tick = (now) => {
          if (!this.canvas.isConnected) {
            this.destroy()
            return
          }
          if (now - this._lastFrame >= 1000 / 30) {
            this._lastFrame = now
            const elapsed = now - this._animStart
            this.time = (elapsed % this.cycleDuration) / this.cycleDuration
            this.render()
          }
          this._rafId = requestAnimationFrame(tick)
        }

        this._rafId = requestAnimationFrame(tick)
      }

      ease(p, g) {
        if (p < 0.5)
          return 0.5 * (2 * p) ** g
        else
          return 1 - 0.5 * (2 * (1 - p)) ** g
      }

      easeOutElastic(x) {
        const c4 = (2 * Math.PI) / 4.5
        if (x <= 0)
          return 0
        if (x >= 1)
          return 1
        return 2 ** (-8 * x) * Math.sin((x * 8 - 0.75) * c4) + 1
      }

      map(value, start1, stop1, start2, stop2) {
        return start2 + (stop2 - start2) * ((value - start1) / (stop1 - start1))
      }

      constrain(value, min, max) {
        return Math.min(Math.max(value, min), max)
      }

      lerp(start, end, t) {
        return start * (1 - t) + end * t
      }

      spiralPath(p) {
        p = this.constrain(1.2 * p, 0, 1)
        p = this.ease(p, 1.8)
        const numberOfSpiralTurns = 6
        const theta = 2 * Math.PI * numberOfSpiralTurns * Math.sqrt(p)
        const r = 170 * Math.sqrt(p)

        return new Vector2D(
          r * Math.cos(theta),
          r * Math.sin(theta) + this.startDotYOffset,
        )
      }

      rotate(v1, v2, p, orientation) {
        const middle = new Vector2D(
          (v1.x + v2.x) / 2,
          (v1.y + v2.y) / 2,
        )

        const dx = v1.x - middle.x
        const dy = v1.y - middle.y
        const angle = Math.atan2(dy, dx)
        const o = orientation ? -1 : 1
        const r = Math.sqrt(dx * dx + dy * dy)

        const bounce = Math.sin(p * Math.PI) * 0.05 * (1 - p)

        return new Vector2D(
          middle.x + r * (1 + bounce) * Math.cos(angle + o * Math.PI * this.easeOutElastic(p)),
          middle.y + r * (1 + bounce) * Math.sin(angle + o * Math.PI * this.easeOutElastic(p)),
        )
      }

      showProjectedDot(position, sizeFactor) {
        const t2 = this.constrain(this.map(this.time, this.changeEventTime, 1, 0, 1), 0, 1)
        const newCameraZ = this.cameraZ + this.ease(t2 ** 1.2, 1.8) * this.cameraTravelDistance

        if (position.z > newCameraZ) {
          const dotDepthFromCamera = position.z - newCameraZ

          const x = this.viewZoom * position.x / dotDepthFromCamera
          const y = this.viewZoom * position.y / dotDepthFromCamera
          const sw = 400 * sizeFactor / dotDepthFromCamera

          this.ctx.lineWidth = sw
          this.ctx.beginPath()
          this.ctx.arc(x, y, 0.5, 0, Math.PI * 2)
          this.ctx.fill()
        }
      }

      drawStartDot() {
        if (this.time > this.changeEventTime) {
          const dy = this.cameraZ * this.startDotYOffset / this.viewZoom
          const position = new Vector3D(0, dy, this.cameraTravelDistance)
          this.showProjectedDot(position, 2.5)
        }
      }

      render() {
        const ctx = this.ctx
        if (!ctx)
          return

        ctx.fillStyle = 'black'
        ctx.fillRect(0, 0, this.size, this.size)

        ctx.save()
        ctx.translate(this.size / 2, this.size / 2)

        const t1 = this.constrain(this.map(this.time, 0, this.changeEventTime + 0.25, 0, 1), 0, 1)
        const t2 = this.constrain(this.map(this.time, this.changeEventTime, 1, 0, 1), 0, 1)

        ctx.rotate(-Math.PI * this.ease(t2, 2.7))

        this.drawTrail(t1)

        ctx.fillStyle = 'white'
        for (const star of this.stars) {
          star.render(t1, this)
        }

        this.drawStartDot()

        ctx.restore()
      }

      drawTrail(t1) {
        for (let i = 0; i < this.trailLength; i++) {
          const f = this.map(i, 0, this.trailLength, 1.1, 0.1)
          const sw = (1.3 * (1 - t1) + 3.0 * Math.sin(Math.PI * t1)) * f

          this.ctx.fillStyle = 'white'
          this.ctx.lineWidth = sw

          const pathTime = t1 - 0.00015 * i
          const position = this.spiralPath(pathTime)

          const basePos = position
          const offset = new Vector2D(position.x + 5, position.y + 5)
          const rotated = this.rotate(
            basePos,
            offset,
            Math.sin(this.time * Math.PI * 2) * 0.5 + 0.5,
            i % 2 === 0,
          )

          this.ctx.beginPath()
          this.ctx.arc(rotated.x, rotated.y, sw / 2, 0, Math.PI * 2)
          this.ctx.fill()
        }
      }

      destroy() {
        this._starBatchCancelled = true
        if (this._batchRafId != null) {
          cancelAnimationFrame(this._batchRafId)
          this._batchRafId = null
        }
        if (this._rafId != null) {
          cancelAnimationFrame(this._rafId)
          this._rafId = null
        }
      }
    }

    let animationController = null

    function getLoadingRoot() {
      return document.querySelector('.loading-container')
    }

    function initAnimation() {
      if (document.hidden || window.__BSP_BOOTSTRAP__?.state !== 'pending') return
      const root = getLoadingRoot()
      const canvas = root?.querySelector('#spiralCanvas')
      if (!root || !canvas)
        return

      const ctx = canvas.getContext('2d')
      if (!ctx)
        return

      const dpr = Math.min(window.devicePixelRatio || 1, 2)
      const width = root.clientWidth
      const height = root.clientHeight
      const size = Math.max(width, height)

      canvas.width = size * dpr
      canvas.height = size * dpr

      canvas.style.width = `${width}px`
      canvas.style.height = `${height}px`

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

      if (animationController) {
        animationController.destroy()
      }

      animationController = new AnimationController(canvas, ctx, dpr, size)
    }

    function stopAnimation() {
      animationController?.destroy()
      animationController = null
    }

    function onVisibilityChange() {
      if (document.hidden) stopAnimation()
      else initAnimation()
    }

    function onBootstrapChange() {
      const bootstrap = window.__BSP_BOOTSTRAP__
      if (bootstrap?.state === 'pending') {
        initAnimation()
        return
      }
      stopAnimation()
      window.removeEventListener('resize', initAnimation)
      document.removeEventListener('visibilitychange', onVisibilityChange)
      if (bootstrap?.state === 'failed') {
        const root = getLoadingRoot()
        if (!root) return
        root.dataset.state = 'failed'
        const label = root.querySelector('.loading-label')
        label.textContent = bootstrap.message.includes('超时') ? '加载超时' : '加载失败'
        label.setAttribute('aria-busy', 'false')
        root.querySelector('.loading-message').textContent = bootstrap.message
        root.querySelector('.loading-feedback').hidden = false
        root.querySelector('.loading-retry').focus()
      }
      else {
        window.removeEventListener('bsp:bootstrap', onBootstrapChange)
      }
    }

    window.addEventListener('resize', initAnimation)
    document.addEventListener('visibilitychange', onVisibilityChange)
    window.addEventListener('bsp:bootstrap', onBootstrapChange)
    getLoadingRoot().querySelector('.loading-retry').addEventListener('click', () => window.location.reload())
    onBootstrapChange()
  })()
</script>
