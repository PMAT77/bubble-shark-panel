services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.13.4}
    build:
      context: .
      dockerfile: docker/unified/Dockerfile
      # SteamCMD 下载源可覆盖：国内直连 steamcdn-a.akamaihd.net 常被中断，
      # 可改用 Steam 的另一条官方 CDN（见 docs_local/DEVELOPMENT.md）。默认值不变。
      # NPM_REGISTRY 留空即官方源（与 GSH_DEV_NPM_REGISTRY 同一口径）；依赖包
      # （@iconify/json 约 60MB）在国内链路上常被 ECONNRESET 打断，可指向 npm 镜像源：
      #   NPM_REGISTRY=https://registry.npmmirror.com docker compose build
      args:
        STEAMCMD_ARCHIVE_URL: ${STEAMCMD_ARCHIVE_URL:-https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: game-server-hub-panel
    restart: unless-stopped
    # 统一镜像保持中性（无 ENTRYPOINT/HEALTHCHECK/USER）：面板入口在此显式指定；
    # DST/SteamCMD 子容器由面板创建时显式传入 Cmd/User。
    command: ["node", "dist-server/main.js"]
    ports:
      - "${PANEL_PORT:-8888}:8888"
    # 可选：复制 panel.env.example 为 panel.env；安装脚本亦可通过 --env-file 注入
    environment:
      NODE_ENV: production
      # 计划任务 daily 按「服务器本地时区」计算；容器默认 UTC 会导致每日任务整体偏移
      TZ: ${TZ:-Asia/Shanghai}
      GSH_PANEL_CONTAINER_NAME: game-server-hub-panel
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8888"
      # PANEL_PORT 故意不给兜底值：兜底值会被面板当成「用户显式声明的对外发布端口」，
      # 启动时把数据库里的「面板端口」设置改写成它（本地裸跑生产 compose 就会把 9527 改成 8888）。
      # 留空 = 未声明 = 启动同步跳过；实际对外端口由 --env-file panel.env 的 PANEL_PORT 决定。
      GSH_PANEL_PUBLISHED_PORT: ${PANEL_PORT:-}
      DB_PATH: /app/data/game-server-hub.sqlite
      SERVER_LOG_DIR: /app/logs
      GSH_INSTANCES_ROOT: /var/lib/game-server-hub/instances
      GSH_BACKUPS_ROOT: /var/lib/game-server-hub/backups
      DOCKER_HOST: unix:///var/run/docker.sock
      PANEL_IMAGE: ${PANEL_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.13.4}
      # 面板内一键更新的 updater 容器镜像（留空自动挑选：目标镜像 → 当前面板镜像 → 官方 CLI 镜像）
      GSH_PANEL_UPDATER_IMAGE: ${GSH_PANEL_UPDATER_IMAGE:-}
      # v0.2.2 起面板/DST/SteamCMD 合并为同一统一镜像；三个变量值一致，保留以便旧配置平滑迁移
      GSH_GAME_DST_IMAGE: ${GSH_GAME_DST_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.13.4}
      GSH_STEAMCMD_IMAGE: ${GSH_STEAMCMD_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.13.4}
      # 备选镜像 registry 候选（逗号分隔）：按顺序优先尝试，全部失败后回退主引用
      GSH_IMAGE_MIRRORS: ${GSH_IMAGE_MIRRORS:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_MB:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB:-}
      GSH_STEAMCMD_APP_INFO_MEMORY_MB: ${GSH_STEAMCMD_APP_INFO_MEMORY_MB:-}
      GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS: ${GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS:-}
      STEAMCMD_USERNAME: ${STEAMCMD_USERNAME:-}
      STEAMCMD_PASSWORD: ${STEAMCMD_PASSWORD:-}
      GSH_STEAMCMD_RUN_USER: ${GSH_STEAMCMD_RUN_USER:-}
      GSH_STEAMCMD_BIND_OPTS: ${GSH_STEAMCMD_BIND_OPTS:-}
      GSH_STEAMCMD_DOWNLOAD_REGION: ${GSH_STEAMCMD_DOWNLOAD_REGION:-}
      GSH_STEAMCMD_HTTP_PROXY: ${GSH_STEAMCMD_HTTP_PROXY:-}
      GSH_STEAMCMD_HTTPS_PROXY: ${GSH_STEAMCMD_HTTPS_PROXY:-}
      GSH_STEAMCMD_NO_PROXY: ${GSH_STEAMCMD_NO_PROXY:-}
      GSH_STEAMCMD_NETWORK_MODE: ${GSH_STEAMCMD_NETWORK_MODE:-}
      GSH_STEAMCMD_INSTALL_MAX_ATTEMPTS: ${GSH_STEAMCMD_INSTALL_MAX_ATTEMPTS:-}
      GSH_STEAMCMD_INSTALL_RETRY_DELAYS_MS: ${GSH_STEAMCMD_INSTALL_RETRY_DELAYS_MS:-}
      GSH_STEAMCMD_APP_UPDATE_TIMEOUT_MS: ${GSH_STEAMCMD_APP_UPDATE_TIMEOUT_MS:-}
      GSH_DST_CONTAINER_MEMORY_MB: ${GSH_DST_CONTAINER_MEMORY_MB:-}
      GSH_DST_CONTAINER_CPU_QUOTA: ${GSH_DST_CONTAINER_CPU_QUOTA:-}
      # 进服地址逃生口：home/NAT/多网卡环境用；缺这两行时 panel.env 里设了也进不了容器
      GSH_DST_CONNECT_HOST: ${GSH_DST_CONNECT_HOST:-}
      GSH_DST_AUTO_PUBLIC_IP: ${GSH_DST_AUTO_PUBLIC_IP:-}
      GSH_INSTALL_SEED_ENABLED: ${GSH_INSTALL_SEED_ENABLED:-}
      GSH_INSTALL_DEFER_DST_IMAGE_PULL: ${GSH_INSTALL_DEFER_DST_IMAGE_PULL:-}
      GSH_EDITION: ${GSH_EDITION:-community}
      GSH_RUNTIME_MODE: docker
      GSH_STACK_DIR: ${GSH_STACK_DIR:-/opt/game-server-hub}
      GSH_COMPOSE_FILES: ${GSH_COMPOSE_FILES:-docker-compose.yml:docker-compose.bind.yml}
      GSH_GITHUB_REPO: ${GSH_GITHUB_REPO:-PMAT77/game-serve-hub}
      # 面板更新下载源：auto=优先 Release 离线镜像包、失败回退 GHCR；offline=只用离线包；pull=只用 GHCR
      GSH_PANEL_UPDATE_SOURCE: ${GSH_PANEL_UPDATE_SOURCE:-auto}
      # Release 离线镜像包的 GitHub 加速代理前缀；留空走内置代理池 + 直连
      GSH_GITHUB_PROXY: ${GSH_GITHUB_PROXY:-}
      # GitHub API 基址（更新检查）；国内可指向兼容反代
      GSH_GITHUB_API_BASE: ${GSH_GITHUB_API_BASE:-}
      # ── Mod 市场（Steam 创意工坊）出站：以下变量同样必须显式映射，否则 panel.env 里配了也不生效 ──
      # 面板访问 Steam 的代理；容器内要指向宿主机得用 host.docker.internal（见 extra_hosts）
      GSH_STEAM_HTTPS_PROXY: ${GSH_STEAM_HTTPS_PROXY:-}
      GSH_STEAM_HTTP_PROXY: ${GSH_STEAM_HTTP_PROXY:-}
      GSH_STEAM_NO_PROXY: ${GSH_STEAM_NO_PROXY:-}
      # Steam Web API 反代（带路径前缀时必须以 / 结尾）
      GSH_STEAM_WEBAPI_BASE_URL: ${GSH_STEAM_WEBAPI_BASE_URL:-}
      GSH_STEAM_WEBAPI_KEY: ${GSH_STEAM_WEBAPI_KEY:-}
      # 创意工坊页面反代（HTML 源）
      GSH_STEAM_COMMUNITY_BASE_URL: ${GSH_STEAM_COMMUNITY_BASE_URL:-}
      # 自建中继
      GSH_STEAM_RELAY_URL: ${GSH_STEAM_RELAY_URL:-}
      GSH_STEAM_RELAY_TOKEN: ${GSH_STEAM_RELAY_TOKEN:-}
      # 超时与缓存窗口
      GSH_STEAM_WORKSHOP_FETCH_TIMEOUT_MS: ${GSH_STEAM_WORKSHOP_FETCH_TIMEOUT_MS:-}
      GSH_STEAM_WORKSHOP_OFFICIAL_TIMEOUT_MS: ${GSH_STEAM_WORKSHOP_OFFICIAL_TIMEOUT_MS:-}
      GSH_STEAM_WORKSHOP_RELAY_TIMEOUT_MS: ${GSH_STEAM_WORKSHOP_RELAY_TIMEOUT_MS:-}
      GSH_STEAM_WORKSHOP_FAST_FAIL_TIMEOUT_MS: ${GSH_STEAM_WORKSHOP_FAST_FAIL_TIMEOUT_MS:-}
      GSH_STEAM_WORKSHOP_TOTAL_BUDGET_MS: ${GSH_STEAM_WORKSHOP_TOTAL_BUDGET_MS:-}
      GSH_STEAM_WORKSHOP_OFFLINE_TTL_MS: ${GSH_STEAM_WORKSHOP_OFFLINE_TTL_MS:-}
      GSH_STEAM_WORKSHOP_STALE_TTL_MS: ${GSH_STEAM_WORKSHOP_STALE_TTL_MS:-}
      GSH_STEAM_WORKSHOP_CACHE_TTL_MS: ${GSH_STEAM_WORKSHOP_CACHE_TTL_MS:-}
      GSH_STEAM_WORKSHOP_WARM_CACHE: ${GSH_STEAM_WORKSHOP_WARM_CACHE:-}
      GSH_STEAM_WORKSHOP_DISABLE_DISK_CACHE: ${GSH_STEAM_WORKSHOP_DISABLE_DISK_CACHE:-}
      GSH_STEAM_WORKSHOP_CACHE_FILE: ${GSH_STEAM_WORKSHOP_CACHE_FILE:-}
      # 宿主机内存判定阈值：面板据此决定是否放行安装/启动，漏映射会让 panel.env 里的值失效
      GSH_HOST_MIN_AVAILABLE_MB: ${GSH_HOST_MIN_AVAILABLE_MB:-}
      GSH_HOST_MEMORY_HEADROOM_MB: ${GSH_HOST_MEMORY_HEADROOM_MB:-}
      GSH_HOST_STEAMCMD_PLANNING_MB: ${GSH_HOST_STEAMCMD_PLANNING_MB:-}
      GSH_HOST_DST_PLANNING_MB: ${GSH_HOST_DST_PLANNING_MB:-}
      # 初始管理员凭证与首登策略：docker compose --env-file panel.env 只做 compose 文件插值，
      # panel.env 里的值必须在这里显式映射才会进入容器，否则容器会以为没配密码而随机生成一个。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-superadmin}
      # 留空即回退「自动生成随机密码并写凭据文件」；非空时该密码即为初始密码
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 默认强制改密，与安装器写入的值保持一致。为 0 且未设置 ADMIN_PASSWORD 时，
      # 自动生成的初始密码会以明文长期留在 data/admin-credentials.txt（只有改密成功才会删除）。
      FORCE_PASSWORD_CHANGE: ${FORCE_PASSWORD_CHANGE:-1}
      # 紧急同步：为 1 时每次启动用 ADMIN_PASSWORD 覆盖数据库中的管理员密码（用完后改回 0）
      GSH_SYNC_ADMIN_PASSWORD_FROM_ENV: ${GSH_SYNC_ADMIN_PASSWORD_FROM_ENV:-0}
      # 在线找回密码：至少 16 位才在登录页启用「忘记密码」
      GSH_PASSWORD_RECOVERY_TOKEN: ${GSH_PASSWORD_RECOVERY_TOKEN:-}
      # 游客（只读预览）免密登录。默认关闭，且**在 Docker 模式下不会被打开**：
      # 本容器挂着 docker.sock，一次有效登录等价于宿主机 root，面板会在启动日志里说明并拒绝。
      # 这两个键保留映射只为「同一份 panel.env 在 Native 与 Docker 间通用」时行为可预期。
      GSH_GUEST_LOGIN_ENABLED: ${GSH_GUEST_LOGIN_ENABLED:-0}
      GSH_GUEST_LOGIN_ACCOUNT: ${GSH_GUEST_LOGIN_ACCOUNT:-guest}
    volumes:
      - gsh-data:/app/data
      - gsh-logs:/app/logs
      - gsh-instances:/var/lib/game-server-hub/instances
      - gsh-backups:/var/lib/game-server-hub/backups
      - /var/run/docker.sock:/var/run/docker.sock
    # 让面板容器能用 host.docker.internal 指向宿主机：容器里的 127.0.0.1 是它自己，
    # 代理跑在宿主机时（GSH_STEAM_HTTPS_PROXY=http://host.docker.internal:7890）
    # 少这一行就连不上代理。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.SERVER_PORT||8888)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  steamcmd:
    image: ${GSH_STEAMCMD_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.13.4}
    profiles:
      - tools
    entrypoint: ["/bin/true"]

volumes:
  gsh-data:
  gsh-logs:
  gsh-instances:
  gsh-backups:
