name: Container Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: container-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR 镜像路径必须全小写：github.repository_owner 为 PMAT77，会导致 buildx 报 repository name must be lowercase。
  # 与一致性检查、compose、文档中硬编码的 ghcr.io/pmat77 保持一致。
  IMAGE_PREFIX: ghcr.io/pmat77

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality checks
        run: pnpm run release:check

      - name: Database schema drift check
        run: |
          pnpm run db:generate
          git diff --exit-code -- server/drizzle
          untracked="$(git ls-files --others --exclude-standard -- server/drizzle)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated migrations:\n%s\n' "$untracked" >&2
            exit 1
          fi

  release-guard:
    name: Release guard
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR for manifest checks
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing or partially published release tag
        shell: bash
        run: |
          set -euo pipefail
          images=(bubblesharkpanel game-server-hub)
          found=0
          for image in "${images[@]}"; do
            target="${IMAGE_PREFIX}/${image}:${GITHUB_REF_NAME}"
            if digest="$(docker buildx imagetools inspect "${target}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')" && [[ -n "${digest}" ]]; then
              echo "Release target already exists: ${target}@${digest}" >&2
              found=1
            fi
          done
          if [[ "${found}" -ne 0 ]]; then
            echo "Release tags are immutable. Use a new version instead of overwriting a complete or partial release." >&2
            exit 1
          fi

  publish-staging:
    name: Publish candidate (${{ matrix.name }})
    needs: release-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.2.0 起统一镜像：面板 + DST 运行库 + SteamCMD 合一
          - name: unified
            context: .
            file: docker/unified/Dockerfile
            image: bubblesharkpanel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require SteamCMD archive checksum
        if: matrix.name == 'unified'
        shell: bash
        env:
          STEAMCMD_ARCHIVE_SHA256: ${{ vars.STEAMCMD_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${STEAMCMD_ARCHIVE_SHA256}" ]]; then
            echo "::error::Repository variable STEAMCMD_ARCHIVE_SHA256 is not set. Refusing to publish an unverified SteamCMD binary; set it to the sha256 of steamcmd_linux.tar.gz." >&2
            exit 1
          fi
          echo "SteamCMD archive checksum pinned: ${STEAMCMD_ARCHIVE_SHA256}"

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
          build-args: |
            BSP_RELEASE_VERSION=${{ github.ref_name }}
            BSP_BUILD_SHA=${{ github.sha }}
            STEAMCMD_ARCHIVE_SHA256=${{ vars.STEAMCMD_ARCHIVE_SHA256 }}

      - name: Record candidate digest
        run: echo "- ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  promote-images:
    name: Promote complete image set
    needs: publish-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate set and promote tags
        shell: bash
        run: |
          set -euo pipefail
          images=(bubblesharkpanel)
          candidate_tag="candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          tags=("${{ github.ref_name }}")
          remote_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }

          # 幂等：正式 tag 已存在说明本次 run 早前 attempt 已完成提升，直接成功（支持 Re-run）。
          first_target="${IMAGE_PREFIX}/bubblesharkpanel:${{ github.ref_name }}"
          if promoted="$(remote_digest "${first_target}" 2>/dev/null)" && [[ -n "${promoted}" ]]; then
            legacy_target="${IMAGE_PREFIX}/game-server-hub:${{ github.ref_name }}"
            legacy_digest="$(remote_digest "${legacy_target}" 2>/dev/null || true)"
            if [[ "${legacy_digest}" == "${promoted}" ]]; then
              echo "Release aliases already promoted with matching digests."
              exit 0
            fi
          fi

          images=(bubblesharkpanel game-server-hub)

          # Finish every read-only check before creating any public tag.
          # GHCR manifest 传播存在秒级延迟（尤其带 provenance/SBOM 的 index），带重试缓冲。
          for image in "${images[@]}"; do
            source="${IMAGE_PREFIX}/bubblesharkpanel:${candidate_tag}"
            digest=""
            for attempt in 1 2 3 4 5 6; do
              if digest="$(remote_digest "${source}" 2>/dev/null)" && [[ -n "${digest}" ]]; then
                break
              fi
              echo "Candidate manifest not visible yet (${source}); retry ${attempt}/6..." >&2
              sleep 10
            done
            if [[ -z "${digest}" ]]; then
              echo "Missing candidate image: ${source}" >&2
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            source="${IMAGE_PREFIX}/bubblesharkpanel:${candidate_tag}"
            source_digest="$(remote_digest "${source}")"
            for tag in "${tags[@]}"; do
              target="${IMAGE_PREFIX}/${image}:${tag}"
              existing_digest="$(remote_digest "${target}" 2>/dev/null || true)"
              if [[ -n "${existing_digest}" && "${existing_digest}" != "${source_digest}" ]]; then
                echo "Refusing to overwrite ${target}@${existing_digest}" >&2
                exit 1
              fi
              docker buildx imagetools create --prefer-index=false --tag "${target}" "${source}"
              target_digest="$(remote_digest "${target}")"
              if [[ "${target_digest}" != "${source_digest}" ]]; then
                echo "Digest mismatch: ${target} expected ${source_digest}, got ${target_digest}" >&2
                exit 1
              fi
              echo "Promoted ${target}@${target_digest}"
            done
          done

  release:
    name: Create GitHub Release
    needs: promote-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Native release
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          cp server/.env.production.example server/.env.production
          pnpm exec vite build
          pnpm run build:native -- --include-node
          version="$(node -p "require('./package.json').version")"
          artifact="bubblesharkpanel-native-v${version}-linux-x64"
          tar -C .artifacts/native -czf ".artifacts/native/${artifact}.tar.gz" "${artifact}"
          sha256sum ".artifacts/native/${artifact}.tar.gz" > ".artifacts/native/${artifact}.tar.gz.sha256"
          legacy="game-server-hub-native-v${version}-linux-x64"
          cp ".artifacts/native/${artifact}.tar.gz" ".artifacts/native/${legacy}.tar.gz"
          sha256sum ".artifacts/native/${legacy}.tar.gz" > ".artifacts/native/${legacy}.tar.gz.sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          images=(bubblesharkpanel game-server-hub)
          remote_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "images": [\n' "${tag}" "${GITHUB_SHA}" > release-images.json
          for index in "${!images[@]}"; do
            image="${images[$index]}"
            reference="${IMAGE_PREFIX}/${image}:${tag}"
            digest="$(remote_digest "${reference}")"
            if [[ -z "${digest}" ]]; then
              echo "Unable to resolve digest for ${reference}" >&2
              exit 1
            fi
            comma=','
            if [[ "${index}" -eq $((${#images[@]} - 1)) ]]; then comma=''; fi
            printf '    {"name":"%s","reference":"%s","digest":"%s"}%s\n' "${image}" "${reference}" "${digest}" "${comma}" >> release-images.json
          done
          printf '  ]\n}\n' >> release-images.json

      - name: Build offline docker image archive
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMAGE_PREFIX}/bubblesharkpanel:${GITHUB_REF_NAME}"
          docker pull "${IMAGE_PREFIX}/game-server-hub:${GITHUB_REF_NAME}"
          docker save "${IMAGE_PREFIX}/bubblesharkpanel:${GITHUB_REF_NAME}" "${IMAGE_PREFIX}/game-server-hub:${GITHUB_REF_NAME}" | gzip > "bubblesharkpanel-${GITHUB_REF_NAME}-docker-image.tar.gz"
          sha256sum "bubblesharkpanel-${GITHUB_REF_NAME}-docker-image.tar.gz" > "bubblesharkpanel-${GITHUB_REF_NAME}-docker-image.tar.gz.sha256"
          cp "bubblesharkpanel-${GITHUB_REF_NAME}-docker-image.tar.gz" "game-server-hub-${GITHUB_REF_NAME}-docker-image.tar.gz"
          sha256sum "game-server-hub-${GITHUB_REF_NAME}-docker-image.tar.gz" > "game-server-hub-${GITHUB_REF_NAME}-docker-image.tar.gz.sha256"

      - name: Package installer script
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.linux.sh "install-${GITHUB_REF_NAME}.sh"
          sha256sum "install-${GITHUB_REF_NAME}.sh" > "install-${GITHUB_REF_NAME}.sh.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release-images.json
            .artifacts/native/*.tar.gz
            .artifacts/native/*.tar.gz.sha256
            bubblesharkpanel-*-docker-image.tar.gz
            game-server-hub-*-docker-image.tar.gz
            game-server-hub-*-docker-image.tar.gz.sha256
            bubblesharkpanel-*-docker-image.tar.gz.sha256
            install-*.sh
            install-*.sh.sha256
          body: |
            本 Release 的统一镜像（面板 + DST 运行环境 + SteamCMD）与 Native systemd 部署包、离线 Docker 镜像包一同发布。

            统一镜像的不可变 digest 见附件 `release-images.json`；Native 包与离线镜像包使用同名 `.sha256` 校验。安装与升级请使用版本 tag 或附件中的 digest，不要依赖 `latest`。

  notify-nexus:
    name: Notify Nexus of published release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dispatch Nexus baseline sync
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NEXUS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping non-formal release tag ${GITHUB_REF_NAME}."
            exit 0
          fi
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Set NEXUS_DISPATCH_TOKEN with Contents write access to bubble-shark-nexus."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          jq -n --arg tag "${GITHUB_REF_NAME}" --arg sha "${sha}" \
            '{event_type: "panel-release", client_payload: {tag: $tag, sha: $sha}}' \
            | gh api --method POST repos/PMAT77/bubble-shark-nexus/dispatches --input -

  cleanup-candidates:
    name: Clean up promoted candidate images
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete candidate package versions
        env:
          GH_TOKEN: ${{ github.token }}
        # GHCR 首次发布后需在 Package settings 授予 Actions 访问权限，否则 DELETE 403；
        # 清理仅用于控制存储，失败不阻塞发布结果。
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          images=(bubblesharkpanel)
          for image in "${images[@]}"; do
            # 正式 tag 与 candidate 可能共用一个 version；删除 version 会删除所有标签。
            version_ids="$(gh api --paginate --slurp \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${image}/versions?per_page=100" \
              | node scripts/select-ghcr-candidates.mjs "${candidate_tag}")"
            for version_id in ${version_ids}; do
              gh api --method DELETE \
                "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${image}/versions/${version_id}"
              echo "Deleted ${image}:${candidate_tag} (version ${version_id})"
            done
          done
