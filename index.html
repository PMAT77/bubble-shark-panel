<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <script id="bsp-bootstrap">
    // 内联执行：入口模块下载或执行失败时，错误出口不能依赖入口模块本身。
    (function () {
      let state = 'pending'
      let message = ''
      let recoverable = false
      const timer = window.setTimeout(() => fail('页面加载超时，请检查连接后重新加载。', true), 30000)

      function notify() {
        window.dispatchEvent(new Event('bsp:bootstrap'))
      }

      function fail(reason, canRecover = false) {
        if (state === 'ready') return
        state = 'failed'
        message = reason
        recoverable = canRecover
        window.clearTimeout(timer)
        notify()
      }

      function onError(event) {
        if (event.target === window) {
          fail('页面启动失败，请重新加载后重试。')
        }
        else if (event.target?.tagName === 'SCRIPT') {
          fail('页面资源加载失败，请重新加载后重试。')
        }
      }

      function onRejection() {
        fail('页面启动失败，请重新加载后重试。')
      }

      function onPreloadError() {
        fail('页面资源加载失败，请重新加载后重试。')
      }

      window.__BSP_BOOTSTRAP__ = {
        get state() { return state },
        get message() { return message },
        fail,
        ready() {
          if (state === 'failed' && !recoverable) return false
          state = 'ready'
          message = ''
          window.clearTimeout(timer)
          window.removeEventListener('error', onError, true)
          window.removeEventListener('unhandledrejection', onRejection)
          window.removeEventListener('vite:preloadError', onPreloadError)
          notify()
          return true
        },
      }
      window.addEventListener('error', onError, true)
      window.addEventListener('unhandledrejection', onRejection)
      window.addEventListener('vite:preloadError', onPreloadError)
    })()
  </script>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/browser_upgrade/index.css" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-control" content="no-cache">
  <meta http-equiv="Cache" content="no-cache">
  <title>%VITE_APP_TITLE%</title>
  <meta name="description"
    content="饥荒联机版（DST）专用服务器管理面板：3 分钟开服，在浏览器里管理世界、Mod、玩家和存档备份，支持 Docker 与裸机两种部署方式。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="%VITE_APP_TITLE%" />
  <meta property="og:description"
    content="饥荒联机版（DST）专用服务器管理面板：3 分钟开服，在浏览器里管理世界、Mod、玩家和存档备份。" />
  <meta name="twitter:card" content="summary" />
</head>

<body>
  <div id="app">
    <div id="browser-upgrade">
      <div class="title">为了您的体验，推荐使用以下浏览器</div>
      <div class="browsers">
        <a href="https://www.microsoft.com/edge" target="_blank" class="browser">
          <img class="browser-icon" src="/browser_upgrade/edge.png" />
          <div class="browser-name">Microsoft Edge</div>
        </a>
        <a href="https://www.google.cn/chrome/" target="_blank" class="browser">
          <img class="browser-icon" src="/browser_upgrade/chrome.png" />
          <div class="browser-name">Google Chrome</div>
        </a>
      </div>
    </div>
  </div>
  <script>
    if (!!window.ActiveXObject || 'ActiveXObject' in window) {
      document.getElementById('browser-upgrade').style.display = 'block'
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
